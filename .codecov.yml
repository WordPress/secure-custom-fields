# Codecov Configuration
# Reference: https://docs.codecov.com/docs/codecovyml-reference

flags:
    e2e:
        carryforward: true # Preserve coverage data across uploads to avoid losing history
        paths:
            - 'assets/src/'
    phpunit:
        carryforward: true # Preserve coverage data across uploads to avoid losing history
        paths:
            - 'includes/'

coverage:
    status:
        project:
            default:
                target: auto
                threshold: 5%
                if_ci_failed: ignore

        patch:
            default:
                target: 70%
                threshold: 5%
                if_ci_failed: ignore
                only_pulls: true

ignore:
    - '*.min.css'
    - '*.min.js'
    - '.wp-env'
    - 'build'
    - 'dist'
    - 'docs'
    - 'node_modules'
    - 'tests'
    - 'vendor'
    # Individual file exclusions
    - 'secure-custom-fields.php' # Bootstrap/initialization code
    - 'includes/abilities/class-scf-ui-options-page-abilities.php' # Thin wrapper - logic tested via base class
    - 'includes/abilities/class-scf-field-group-abilities.php' # Thin wrapper - logic tested via base class
