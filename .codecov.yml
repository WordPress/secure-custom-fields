# Codecov Configuration
# Reference: https://docs.codecov.com/docs/codecovyml-reference

codecov:
    require_ci_to_pass: true

flags:
    e2e-js:
        carryforward: true
        paths:
            - 'assets/src/'
        # Some shards may not have JS coverage (REST API tests only)
        # Carryforward handles missing uploads from those shards
    e2e-php:
        carryforward: true
        paths:
            - 'includes/'
    phpunit:
        carryforward: true
        paths:
            - 'includes/'

coverage:
    status:
        project:
            default:
                target: auto
                threshold: 5%
                if_ci_failed: ignore

        patch:
            default:
                target: 70%
                threshold: 5%
                if_ci_failed: ignore
                only_pulls: true

ignore:
    - '*.min.css'
    - '*.min.js'
    - '.wp-env'
    - 'bin/' # CLI/infrastructure scripts - integration code with external APIs
    - 'build'
    - 'dist'
    - 'docs'
    - 'node_modules'
    - 'tests'
    - 'vendor'
    # Individual file exclusions
    - 'secure-custom-fields.php' # Bootstrap/initialization code
    - 'includes/abilities/class-scf-ui-options-page-abilities.php' # Thin wrapper - logic tested via base class
    - 'includes/abilities/class-scf-field-group-abilities.php' # Thin wrapper - logic tested via base class
