name: E2E Tests

on:
    pull_request:
        branches: [trunk]
    push:
        branches: [trunk]
    # Allow manually triggering the workflow
    workflow_dispatch:

# Cancels all previous workflow runs for pull requests that have not completed
concurrency:
    group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
    cancel-in-progress: true

# Disable permissions for all available scopes by default
permissions: {}

jobs:
    test:
        name: E2E - Node ${{ matrix.node }} / WP ${{ matrix.wp }} / Shard ${{ matrix.shard }}/4
        runs-on: ubuntu-latest
        permissions:
            contents: read

        strategy:
            fail-fast: false
            matrix:
                event: ['${{ github.event_name }}']
                shard: [1, 2, 3, 4]
                node: ['22', '24']
                wp: ['6.2', 'latest', 'trunk']
                exclude:
                    # On PRs: only test Node 22 + WP latest and trunk for fast feedback
                    # On trunk: full matrix with node 24 and minimum WP version
                    - event: 'pull_request'
                      node: '24'

        env:
            WP_ENV_CORE: ${{ matrix.wp == 'trunk' && 'WordPress/WordPress' || (matrix.wp != 'latest' && format('WordPress/WordPress#{0}', matrix.wp) || null) }}

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: 'npm'

            - name: Install dependencies
              run: |
                  npm ci
                  composer install --prefer-dist --no-progress

            - name: Npm build with coverage instrumentation
              env:
                  COVERAGE_ENABLED: true
              run: npm run build

            - name: Start wp-env and install PCOV
              env:
                  PHP_COVERAGE_ENABLED: true
              run: npm run wp-env start

            - name: Install Playwright browsers
              run: npx playwright install --with-deps

            - name: Run e2e tests with coverage
              env:
                  PHP_COVERAGE_ENABLED: true
              run: npm run test:e2e:coverage -- --shard=${{ matrix.shard }}/4

            - name: Archive debug artifacts (screenshots, traces)
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ !cancelled() }}
              with:
                  name: failures-artifacts--node${{ matrix.node }}-wp${{ matrix.wp }}-shard${{ matrix.shard }}
                  path: artifacts/test-results
                  if-no-files-found: ignore

            - name: Archive blob reports (HTML)
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              if: ${{ !cancelled() }}
              with:
                  name: blob-reports--node${{ matrix.node }}-wp${{ matrix.wp }}-shard${{ matrix.shard }}
                  path: blob-report
                  if-no-files-found: ignore

            - name: Generate E2E JS coverage report
              if: always()
              run: |
                  if [ -d ".nyc_output" ] && [ "$(ls -A .nyc_output 2>/dev/null)" ]; then
                    echo "Generating JS coverage report"
                    npm run test:e2e:coverage:report
                  else
                    echo "No JS coverage data found"
                  fi

            - name: Generate E2E PHP coverage report
              if: always()
              run: npm run test:e2e:php-coverage:report

            - name: Upload E2E JS Coverage to Codecov
              if: always() && hashFiles('./coverage/e2e/lcov.info') != ''
              uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5.5.3
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/e2e/lcov.info
                  flags: e2e-js
                  slug: WordPress/secure-custom-fields
                  name: e2e-js-shard${{ matrix.shard }}
                  disable_search: true

            - name: Upload E2E PHP Coverage to Codecov
              if: always() && hashFiles('./coverage/php-e2e/lcov.info') != ''
              uses: codecov/codecov-action@1af58845a975a7985b0beb0cbe6fbbb71a41dbad # v5.5.3
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  files: ./coverage/php-e2e/lcov.info
                  flags: e2e-php
                  slug: WordPress/secure-custom-fields
                  name: e2e-php-shard${{ matrix.shard }}
                  disable_search: true

            - name: Stop wp-env
              if: always()
              run: npm run wp-env stop

    merge-artifacts:
        name: Merge Artifacts
        if: ${{ !cancelled() }}
        needs: [test]
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Setup Node.js
              uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Merge failures artifacts
              uses: actions/upload-artifact/merge@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              continue-on-error: true
              with:
                  name: failures-artifacts
                  pattern: failures-artifacts--*
                  delete-merged: true

            - name: Merge blob reports
              uses: actions/upload-artifact/merge@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              continue-on-error: true
              with:
                  name: blob-reports-merged
                  pattern: blob-reports--*
                  delete-merged: true

            - name: Download merged blob reports
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              continue-on-error: true
              with:
                  name: blob-reports-merged
                  path: all-blob-reports

            - name: Merge blob reports into HTML report
              run: npx playwright merge-reports --reporter html ./all-blob-reports
              continue-on-error: true

            - name: Upload merged HTML report
              uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
              continue-on-error: true
              with:
                  name: html-report--attempt-${{ github.run_attempt }}
                  path: playwright-report
                  if-no-files-found: ignore
